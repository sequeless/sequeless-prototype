spring:
  application:
    name: sequeless-app
sequeless:
  api:
    # Prefix every org.sequeless.app.rest controller is served under (default /api), set in
    # ApiPathPrefixConfiguration via a package-scoped prefix predicate. Blank restores the
    # pre-prefix unprefixed routing; springdoc and Actuator are never affected by this value.
    base-path: /api
  authz:
    adapter: permit-all
  expression:
    adapter: jexl
  ontology:
    adapter: jena
    # owl is the only setting that detects an inconsistent ontology: rdfs inference never notices
    # owl:disjointWith, and none attaches no reasoner at all. See JenaOntologyProperties.
    reasoner: owl
    source: classpath:ontology/reference.ttl
  persistence:
    adapter: postgres
    # Matches docker-compose.yml's postgres service (POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD).
    # Only used by the manual smoke test (docker compose up -d postgres + spring-boot:run): every
    # automated test overrides these via PostgresTestcontainersSupport's @DynamicPropertySource.
    url: jdbc:postgresql://localhost:5432/sequeless
    username: sequeless
    password: sequeless
  validation:
    adapter: shacl
  # Serves the built Angular single page app from the same port via
  # SpaWebConfiguration: enabled toggles it, location is the static resource root, and
  # index is the fallback resource for non-API paths. When no index resource is present the
  # fallback yields a plain 404 instead of an error, so mvn verify stays green with no UI
  # build in place.
  web:
    spa:
      enabled: true
      location: classpath:/static/
      index: index.html
management:
  endpoints:
    web:
      exposure:
        include: health
