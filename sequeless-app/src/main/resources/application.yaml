spring:
  application:
    name: sequeless-app
sequeless:
  authz:
    adapter: permit-all
  expression:
    adapter: jexl
  ontology:
    adapter: jena
    # owl is the only setting that detects an inconsistent ontology: rdfs inference never notices
    # owl:disjointWith, and none attaches no reasoner at all. See JenaOntologyProperties.
    reasoner: owl
    source: classpath:ontology/reference.ttl
  persistence:
    adapter: postgres
    # Matches docker-compose.yml's postgres service (POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD).
    # Only used by the manual smoke test (docker compose up -d postgres + spring-boot:run): every
    # automated test overrides these via PostgresTestcontainersSupport's @DynamicPropertySource.
    url: jdbc:postgresql://localhost:5432/sequeless
    username: sequeless
    password: sequeless
  validation:
    adapter: shacl
management:
  endpoints:
    web:
      exposure:
        include: health
