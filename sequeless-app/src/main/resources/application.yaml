spring:
  application:
    name: sequeless-app
sequeless:
  authz:
    adapter: permit-all
  ontology:
    adapter: jena
    # owl is the only setting that detects an inconsistent ontology: rdfs inference never notices
    # owl:disjointWith, and none attaches no reasoner at all. See JenaOntologyProperties.
    reasoner: owl
    source: classpath:ontology/reference.ttl
management:
  endpoints:
    web:
      exposure:
        include: health
