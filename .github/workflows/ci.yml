name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    uses: sequeless/sequeless-build/.github/workflows/maven-ci.yml@workflows-v0.1.0
    secrets: inherit

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sequeless-ui/package-lock.json

      - run: npm run ci:ui

  combined:
    if: ${{ vars.CI_COMBINED_JOB == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sequeless-ui/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - run: npm run ci:combined
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
